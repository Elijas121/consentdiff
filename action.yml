name: consentdiff
description: "Test what a website does before and after the cookie banner: trackers before consent, after reject and after accept."
author: Elias Delil
branding:
  icon: shield
  color: blue

inputs:
  url:
    description: URL to scan
    required: true
  fail-on:
    description: "Fail the job at this severity or above: error, warn or never (never also ignores a page that cannot be measured, but not a usage error)"
    default: error
  imprint:
    description: "Imprint check: auto, always or never"
    default: auto
  first-party:
    description: Extra first-party domain of the site operator (one domain)
    default: ""
  report:
    description: Path of the Markdown report file
    default: consentdiff-report.md

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        package-manager-cache: false
    - name: Install consentdiff
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm exec playwright install --with-deps chromium
        pnpm build
    - name: Scan
      shell: bash
      env:
        CP_URL: ${{ inputs.url }}
        CP_FAIL_ON: ${{ inputs.fail-on }}
        CP_IMPRINT: ${{ inputs.imprint }}
        CP_FIRST_PARTY: ${{ inputs.first-party }}
        CP_REPORT: ${{ inputs.report }}
      run: |
        args=("$CP_URL" --format md --out "$CP_REPORT" --fail-on "$CP_FAIL_ON" --imprint "$CP_IMPRINT")
        if [ -n "$CP_FIRST_PARTY" ]; then args+=(--first-party "$CP_FIRST_PARTY"); fi
        rm -f "$CP_REPORT"
        err="$RUNNER_TEMP/consentdiff-stderr.txt"
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" 2> "$err"
        code=$?
        set -e
        # The error text can quote the scanned page: never let it act as a workflow command.
        token="consentdiff-$RANDOM$RANDOM$RANDOM"
        echo "::stop-commands::$token"
        cat "$err"
        echo "::$token::"
        if [ -f "$CP_REPORT" ]; then
          cat "$CP_REPORT" >> "$GITHUB_STEP_SUMMARY"
        elif [ -s "$err" ]; then
          # An indented code block cannot be closed by the quoted text.
          { echo "### consentdiff could not measure the page"; echo; sed 's/^/    /' "$err"; } >> "$GITHUB_STEP_SUMMARY"
        fi
        # fail-on: never means never for the page: findings (1) and a page that cannot be measured (2)
        # do not fail the job. A usage or setup error (3), e.g. a mistyped input, always does.
        if [ "$CP_FAIL_ON" = "never" ] && [ "$code" -le 2 ]; then exit 0; fi
        exit $code
