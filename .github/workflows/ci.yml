name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm 11 needs Node 22+ (node:sqlite), so install with 22 ...
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # ... then run the tool and its tests on the Node version under test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --version
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/vitest/vitest.mjs run
      - run: node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - run: node dist/cli.js --version

  action-smoke:
    # Runs the composite action from this repository against a public test page.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          url: https://example.com
          fail-on: never
          imprint: never
      - name: The action wrote a report
        run: test -s consentprobe-report.md

  package:
    # Installs the packed tarball like a user would and runs the installed CLI.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball in an empty project and scan a page
        working-directory: ${{ runner.temp }}
        run: |
          mkdir user && cd user && npm init -y >/dev/null
          npm install ../consentprobe-*.tgz
          npx consentprobe --version
          npx consentprobe --install-browser --with-deps
          set +e
          npx consentprobe https://example.com --no-click-test --imprint never --format json --out report.json
          code=$?
          set -e
          node -e "const r=require('./report.json'); if (!r.tool.browser || !r.finalUrl) process.exit(1)"
          # Exit codes: 0 = passed, 1 = findings at or above --fail-on, 2 = page not measurable, 3 = usage error.
          [ "$code" -le 1 ]
          npx consentprobe a.example b.example && exit 1 || [ $? -eq 3 ]
